name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install go-pmtiles
        run: go install github.com/protomaps/go-pmtiles@latest

      # The source data (map extract, population grid, elevation tiles) is a few hundred MB;
      # keep it between runs so most deploys don't download it again.
      - uses: actions/cache@v6
        with:
          path: .cache/citygen
          key: citygen-${{ hashFiles('tools/citygen/cities/*.json') }}
          restore-keys: citygen-

      - run: npm ci

      - run: npm test

      - name: Build the Moscow city pack
        run: npm run city -- moscow

      - name: Build the game
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
